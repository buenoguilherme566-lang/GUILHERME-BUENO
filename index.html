
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HPS CONTROL</title>
    <meta name="description" content="Sistema de gestão especializada de estoque, clientes e ordens de serviço Can-Am BRP com integração Supabase e controle de QR code." />
    <meta property="og:title" content="HPS CONTROL" />
    <meta property="og:description" content="Sistema de gestão especializada de estoque, clientes e ordens de serviço Can-Am BRP com integração Supabase e controle de QR code." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      .shadow-glow { box-shadow: 0 0 25px rgba(34, 197, 94, 0.25); }
      .text-glow { text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
      
      @media print {
        @page { size: A4 portrait; margin: 10mm; }
        .print-hidden { display: none !important; }
        .print-only { display: block !important; }
        #printable-os-document { display: block !important; visibility: visible !important; position: static !important; width: 100% !important; }
        body { background: white !important; color: black !important; }
        .label-sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .label-card { border: 1px solid #ccc; padding: 10px; text-align: center; page-break-inside: avoid; }
      }
      #printable-os-document { display: none; }
      .print-only { display: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Animação para feedback de IA */
      @keyframes pulse-green {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      .ai-searching { animation: pulse-green 2s infinite; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-black text-zinc-100 font-sans overscroll-none">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
